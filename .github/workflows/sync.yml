name: sync-docs

on:
  schedule:
    # Daily at 07:41 HKT (23:41 UTC) — off the :00/:30 mark.
    - cron: "41 23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync docs from cibo.hk
        run: python3 sync_docs.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add llms.txt openapi.json README.md
            git commit -m "docs: auto-sync from cibo.hk"
            git push
          else
            echo "No changes to commit."
          fi
